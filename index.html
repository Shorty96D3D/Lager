<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lager-Manager Pro Elite</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #ff4444; --warning: #ffbb33; --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; }
        body { font-family: -apple-system, sans-serif; padding: 10px; background: var(--bg); color: var(--text); line-height: 1.4; margin: 0; padding-bottom: 50px; }
        
        .card { background: var(--card); padding: 15px; border-radius: 12px; max-width: 600px; margin: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h2 { color: var(--success); text-align: center; text-transform: uppercase; margin-bottom: 15px; }
        
        .section { background: #252525; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        h3 { font-size: 13px; margin: 0 0 10px 0; color: #00d4ff; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 5px; }

        label { display: block; margin-top: 8px; font-size: 10px; color: #888; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin-top: 4px; border: 1px solid #444; border-radius: 6px; background: #121212; color: white; font-size: 16px; box-sizing: border-box; }
        
        /* Lager-Tabs mit Farbindikator */
        .warehouse-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; align-items: center; }
        .warehouse-tab { background: #333; padding: 8px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 13px; border: 2px solid transparent; display: flex; align-items: center; gap: 6px; }
        .warehouse-tab.active { background: var(--primary); font-weight: bold; border-color: white; }
        .color-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #fff; }

        /* Projekt Gruppierung */
        .project-group { margin-bottom: 20px; border: 1px solid #333; border-radius: 10px; overflow: hidden; }
        .project-header { background: #2a2a2a; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .project-header strong { color: #00d4ff; }

        /* Artikel Karte */
        .inventory-item { background: #1e1e1e; padding: 15px; border-bottom: 1px solid #333; border-left: 5px solid transparent; }
        .low-stock { border-left-color: var(--danger) !important; background: #2a1515; }
        
        /* Fortschrittsbalken */
        .stock-bar-container { width: 100%; height: 10px; background: #111; border-radius: 5px; margin: 10px 0; overflow: hidden; border: 1px solid #333; }
        .stock-bar { height: 100%; transition: 0.4s ease-out; }

        .item-controls { display: grid; grid-template-columns: 1fr 1.2fr 1fr 0.6fr; gap: 8px; margin-top: 15px; }
        .btn-action { height: 48px; font-size: 22px; color: white; border: none; border-radius: 8px; cursor: pointer; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); overflow-y: auto; }
        .modal-content { background: var(--card); margin: 10% auto; padding: 25px; border-radius: 15px; width: 85%; max-width: 450px; border: 1px solid var(--primary); }
    </style>
</head>
<body>

<div class="card" id="main-container">
    <h2 id="app-title">📦 Lager-Manager Pro</h2>

    <div class="warehouse-nav" id="warehouse-tabs"></div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
        <button onclick="openShoppingList()" style="background:var(--primary); color:white; padding:14px; border-radius:10px;">🛒 Einkaufsliste <span id="low-count-badge" style="background:var(--danger); padding:2px 8px; border-radius:10px;">0</span></button>
        <button onclick="openExport()" style="background:#444; color:white; padding:14px; border-radius:10px;">💾 Backup</button>
    </div>

    <div class="section">
        <h3>🏠 Artikel / Projekt anlegen</h3>
        <input type="text" id="name" placeholder="Bezeichnung (z.B. Rauchmelder)">
        <input type="text" id="category" placeholder="Projekt/Tag (z.B. Baustelle Süd)">
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
            <div><label>Preis €</label><input type="number" id="price" step="0.01" placeholder="0.00"></div>
            <div><label>Bestand</label><input type="number" id="stock" placeholder="0"></div>
            <div><label>Min</label><input type="number" id="min" placeholder="5"></div>
        </div>
        <button onclick="preSaveItem()" style="background:var(--success); color:white; width:100%; padding:14px; margin-top:15px; border-radius:10px;">💾 Artikel einlagern</button>
    </div>

    <div class="section">
        <h3>⚙️ Neues Lager</h3>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="new-wh-name" placeholder="Name...">
            <input type="color" id="new-wh-color" value="#007bff" style="width:60px; height:45px; padding:2px;">
            <button onclick="addWarehouse()" style="background:var(--primary); color:white; padding:0 15px; border-radius:8px;">+</button>
        </div>
    </div>

    <input type="text" id="search" style="border: 2px solid var(--primary); margin-bottom: 15px;" placeholder="🔍 Suchen..." onkeyup="render()">
    <div id="inventory-list"></div>
</div>

<div id="saveModal" class="modal">
    <div class="modal-content">
        <h3>📍 Ziel-Lager wählen</h3>
        <select id="select-target-wh" style="margin: 15px 0;"></select>
        <button onclick="confirmSaveItem()" style="background:var(--success); color:white; width:100%; padding:15px; border-radius:10px;">Speichern</button>
        <button onclick="closeModal('saveModal')" style="background:none; color:white; margin-top:10px; width:100%;">Abbrechen</button>
    </div>
</div>

<div id="moveProjectModal" class="modal">
    <div class="modal-content">
        <h3 id="move-proj-title">Projekt umbuchen</h3>
        <label>Verschieben nach:</label>
        <select id="move-proj-target" style="margin-bottom:15px;"></select>
        <button onclick="executeProjectMove()" style="background:var(--success); color:white; width:100%; padding:15px; border-radius:10px;">Projekt jetzt verschieben</button>
        <button onclick="closeModal('moveProjectModal')" style="background:none; color:white; margin-top:10px; width:100%;">Abbrechen</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('d3d_storage_v7')) || { 
        "Hauptlager": { color: "#007bff", items: [] } 
    };
    let currentWH = Object.keys(db)[0];
    let tempItem = null;
    let selectedProject = "";

    function save() { 
        localStorage.setItem('d3d_storage_v7', JSON.stringify(db)); 
        render(); 
    }

    function addWarehouse() {
        const name = document.getElementById('new-wh-name').value.trim();
        const color = document.getElementById('new-wh-color').value;
        if(name && !db[name]) { 
            db[name] = { color: color, items: [] }; 
            currentWH = name; 
            document.getElementById('new-wh-name').value = ''; 
            save(); 
        }
    }

    function preSaveItem() {
        const name = document.getElementById('name').value;
        if(!name) return alert("Name fehlt!");
        tempItem = {
            name: name,
            category: document.getElementById('category').value || "Allgemein",
            price: parseFloat(document.getElementById('price').value) || 0,
            stock: parseInt(document.getElementById('stock').value) || 0,
            min: parseInt(document.getElementById('min').value) || 0
        };
        const select = document.getElementById('select-target-wh');
        select.innerHTML = '';
        Object.keys(db).forEach(wh => select.options.add(new Option(wh, wh)));
        document.getElementById('saveModal').style.display = 'block';
    }

    function confirmSaveItem() {
        const target = document.getElementById('select-target-wh').value;
        db[target].items.push(tempItem);
        ["name", "category", "price", "stock", "min"].forEach(id => document.getElementById(id).value = '');
        closeModal('saveModal');
        currentWH = target;
        save();
    }

    function render() {
        // Hintergrundfarbe des Containers leicht anpassen an Lagerfarbe
        document.getElementById('main-container').style.borderTop = `5px solid ${db[currentWH].color}`;
        
        const tabs = document.getElementById('warehouse-tabs');
        tabs.innerHTML = '';
        Object.keys(db).forEach(wh => {
            const div = document.createElement('div');
            div.className = `warehouse-tab ${wh === currentWH ? 'active' : ''}`;
            div.innerHTML = `<span class="color-dot" style="background:${db[wh].color}"></span>${wh}`;
            div.onclick = () => { currentWH = wh; render(); };
            tabs.appendChild(div);
        });

        const list = document.getElementById('inventory-list');
        const searchTerm = document.getElementById('search').value.toLowerCase();
        list.innerHTML = '';

        // Gruppieren
        const grouped = {};
        db[currentWH].items.forEach((item, idx) => {
            if(searchTerm && !item.name.toLowerCase().includes(searchTerm) && !item.category.toLowerCase().includes(searchTerm)) return;
            if(!grouped[item.category]) grouped[item.category] = [];
            grouped[item.category].push({ ...item, originalIdx: idx });
        });

        Object.keys(grouped).forEach(cat => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'project-group';
            
            let header = `<div class="project-header">
                <strong>📂 ${cat}</strong>
                <button onclick="openMoveProject('${cat}')" style="background:#444; color:white; padding:4px 8px; border-radius:5px; font-size:10px;">Umbuchen ✈️</button>
            </div>`;
            
            let itemsHtml = '';
            grouped[cat].forEach(item => {
                const isCrit = item.stock <= item.min;
                // Balken Logik
                const ratio = item.min > 0 ? (item.stock / (item.min * 2)) * 100 : 100;
                let barColor = "var(--success)"; // Grün
                if(item.stock <= item.min) barColor = "var(--danger)"; // Rot
                else if(item.stock <= item.min * 1.5) barColor = "var(--warning)"; // Gelb

                itemsHtml += `
                    <div class="inventory-item ${isCrit ? 'low-stock' : ''}">
                        <div style="display:flex; justify-content:space-between;">
                            <strong>${item.name}</strong>
                            <small style="color:#888;">Min: ${item.min}</small>
                        </div>
                        <div class="stock-bar-container">
                            <div class="stock-bar" style="width:${Math.min(100, ratio)}%; background:${barColor}"></div>
                        </div>
                        <div style="font-size:18px; font-weight:bold;">Bestand: ${item.stock}</div>
                        <div class="item-controls">
                            <button class="btn-action" style="background:var(--success)" onclick="updateQty(${item.originalIdx}, 1)">+</button>
                            <input type="number" id="input-${item.originalIdx}" style="text-align:center; background:#111; color:white; border:none;" placeholder="1">
                            <button class="btn-action" style="background:var(--danger)" onclick="updateQty(${item.originalIdx}, -1)">-</button>
                            <button class="btn-action" style="background:#333" onclick="deleteItem(${item.originalIdx})">🗑️</button>
                        </div>
                    </div>`;
            });
            
            groupDiv.innerHTML = header + itemsHtml;
            list.appendChild(groupDiv);
        });
        updateBadge();
    }

    function updateQty(idx, dir) {
        const val = parseInt(document.getElementById(`input-${idx}`).value) || 1;
        db[currentWH].items[idx].stock = Math.max(0, db[currentWH].items[idx].stock + (val * dir));
        save();
    }

    function openMoveProject(cat) {
        selectedProject = cat;
        document.getElementById('move-proj-title').innerText = `🚀 "${cat}" umbuchen`;
        const select = document.getElementById('move-proj-target');
        select.innerHTML = '';
        Object.keys(db).forEach(wh => { if(wh !== currentWH) select.options.add(new Option(wh, wh)); });
        document.getElementById('moveProjectModal').style.display = 'block';
    }

    function executeProjectMove() {
        const target = document.getElementById('move-proj-target').value;
        if(!target) return alert("Kein Ziel gewählt!");
        
        const toMove = db[currentWH].items.filter(i => i.category === selectedProject);
        db[target].items.push(...toMove);
        db[currentWH].items = db[currentWH].items.filter(i => i.category !== selectedProject);
        
        closeModal('moveProjectModal');
        save();
    }

    function deleteItem(idx) { if(confirm("Löschen?")) { db[currentWH].items.splice(idx, 1); save(); } }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function updateBadge() {
        let count = 0;
        Object.keys(db).forEach(wh => db[wh].items.forEach(i => { if(i.stock <= i.min) count++; }));
        document.getElementById('low-count-badge').innerText = count;
    }
    function openExport() { prompt("Backup-Code (Kopieren & Sichern):", btoa(JSON.stringify(db))); }
    
    window.onload = render;
</script>
</body>
</html>
